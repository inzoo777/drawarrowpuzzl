<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Arrow Walking - 50 Levels Puzzle</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    body {
      background: #111827;
      color: #fff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 10px;
    }

    /* Mobile Game Container */
    #game-card {
      width: 100%;
      max-width: 420px;
      background: #1f2937;
      border-radius: 20px;
      padding: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    /* Header UI */
    .header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .level-badge {
      background: #374151;
      padding: 6px 14px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: bold;
      color: #60a5fa;
    }

    .info-text {
      font-size: 13px;
      color: #9ca3af;
      text-align: right;
    }

    /* Canvas Frame */
    .canvas-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 1;
      background: #111827;
      border-radius: 16px;
      overflow: hidden;
      border: 2px solid #374151;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    canvas {
      display: block;
      touch-action: none;
    }

    /* Controls Bar */
    .controls {
      width: 100%;
      display: flex;
      gap: 10px;
    }

    .btn {
      flex: 1;
      padding: 12px 16px;
      border: none;
      border-radius: 12px;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn-reset {
      background: #ef4444;
      color: white;
    }

    .btn-reset:active {
      background: #dc2626;
      transform: scale(0.97);
    }

    .btn-run {
      background: #10b981;
      color: white;
    }

    .btn-run:active {
      background: #059669;
      transform: scale(0.97);
    }

    /* Overlay Modals */
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(17, 24, 39, 0.92);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
      border-radius: 16px;
    }

    .overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-title {
      font-size: 24px;
      font-weight: 800;
      text-align: center;
    }

    .modal-title.win { color: #34d399; }
    .modal-title.fail { color: #f87171; }

    .btn-modal {
      background: #2563eb;
      color: white;
      padding: 12px 28px;
      border-radius: 12px;
      border: none;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
    }

    .btn-modal:active {
      background: #1d4ed8;
    }
  </style>
</head>
<body>

<div id="game-card">
  <div class="header">
    <div id="level-display" class="level-badge">Level 1 / 50</div>
    <div class="info-text">Drag line to goal</div>
  </div>

  <div class="canvas-wrapper">
    <canvas id="gameCanvas"></canvas>
    
    <!-- Win Overlay -->
    <div id="win-overlay" class="overlay">
      <div id="win-text" class="modal-title win">🎉 Level Cleared!</div>
      <button class="btn-modal" onclick="nextLevel()">Next Level ➔</button>
    </div>

    <!-- Fail Overlay -->
    <div id="fail-overlay" class="overlay">
      <div class="modal-title fail">❌ Goal Not Reached</div>
      <button class="btn-modal" onclick="resetPath()">Try Again 🔄</button>
    </div>
  </div>

  <div class="controls">
    <button class="btn btn-reset" onclick="resetPath()">🔄 Reset</button>
    <button class="btn btn-run" onclick="startWalking()">▶ Walk Arrow</button>
  </div>
</div>
